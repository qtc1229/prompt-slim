<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prompt Slim</title>
<style>body{margin:0;background:#f3f5fa;color:#182135;font:16px/1.6 system-ui}main{max-width:1100px;margin:48px auto;padding:0 24px}h1{font-size:38px;margin:8px 0}.muted{color:#59677f}section{background:white;border:1px solid #dce3ef;border-radius:16px;padding:24px;margin:24px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}textarea{box-sizing:border-box;width:100%;min-height:280px;padding:14px;border:1px solid #b8c6dc;border-radius:8px;font:15px/1.6 system-ui;resize:vertical}#protected{min-height:90px}select,button{padding:10px 14px;border:1px solid #b8c6dc;border-radius:8px;font:inherit}button{background:#304fdd;color:white;cursor:pointer}button:disabled{opacity:.5}label{display:block;font-weight:600;margin:14px 0 8px}#status{white-space:pre-wrap}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f3f5fa;padding:14px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style>
<main><p id="version" class="muted"></p><p class="muted">LOCAL-FIRST / OPEN SOURCE PROTOTYPE</p><h1>让需求更简洁，保留关键约束。</h1><p class="muted">通过 Ollama 在本机编辑 Prompt。当前版本不发送到云端。</p>
<section><label for="model">本地模型</label><select id="model"><option value="">正在检查 Ollama…</option></select> <button id="refresh">刷新模型</button>
<div class="grid"><div><label for="source">原始 Prompt</label><textarea id="source" placeholder="粘贴需求或背景材料"></textarea></div><div><label for="output">最终结果</label><textarea id="output" readonly placeholder="结果会显示在这里"></textarea></div></div>
<label for="protected">必须原样保留的片段（可选，每行一个，须存在于原文）</label><textarea id="protected" placeholder="例如：禁止覆盖"></textarea>
<p><button id="compress">保守压缩</button> <button id="copy">复制结果</button></p><p id="status" role="status" aria-live="polite"></p>
<details><summary>查看模型候选结果及 token（未采用时仅供诊断）</summary><pre id="candidate"></pre></details><details><summary>并排核对修改</summary><div class="grid"><pre id="before"></pre><pre id="after"></pre></div></details></section>
<p class="muted">显示 o200k_base 参考文本 token，不代表所有模型的计费。指定片段缺失、输出为空或参考 token 未减少时回退原文。自动检查不保证语义完整，请核对结果。</p></main>
<script>
const $=id=>document.getElementById(id);
async function models(){try{const r=await fetch('/api/models');const d=await r.json();if(!r.ok)throw Error(d.error);$('model').replaceChildren();for(const m of d.models){$('model').append(new Option(m,m))}$('status').textContent=d.models.length?'模型已就绪':'Ollama 已启动，还没有下载模型'}catch(e){$('model').replaceChildren(new Option('Ollama 未就绪',''));$('status').textContent=e.message}}
$('refresh').onclick=models;
$('compress').onclick=async()=>{const source=$('source').value;$('compress').disabled=true;$('output').value='';$('before').textContent='';$('after').textContent='';$('candidate').textContent='';$('status').textContent='本地模型正在处理…';try{const r=await fetch('/api/compress',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:source,model:$('model').value,protected:$('protected').value})});const d=await r.json();if(!r.ok)throw Error(d.error);$('candidate').textContent='候选 token：'+d.candidate_tokens+'\n'+d.candidate;$('output').value=d.text;$('before').textContent=source;$('after').textContent=d.text;$('status').textContent=(d.fallback?'已回退原文':'压缩完成')+' · 参考 token '+d.original_tokens+' → '+d.compressed_tokens+' · 字符 '+d.original_chars+' → '+d.compressed_chars+' · '+d.seconds+' 秒\n'+d.warnings.join('\n')+'\no200k_base 文本计数，不等于 Claude / DeepSeek 计费或完整请求 token。请检查关键约束。'}catch(e){$('status').textContent=e.message}finally{$('compress').disabled=false}};
$('copy').onclick=async()=>{if(!$('output').value)return;try{await navigator.clipboard.writeText($('output').value);$('status').textContent='已复制，请核对后使用。'}catch(e){$('status').textContent='请手动选择结果并复制。'}};models();
fetch('/api/health').then(r=>r.json()).then(d=>{$('version').textContent='版本 '+d.version+' · '+d.build+(d.restart_required?' · 后台代码已更新，请重启服务':'');}).catch(()=>{$('version').textContent='后台版本过旧，请关闭旧服务并重启。'});
</script></html>
